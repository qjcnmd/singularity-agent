[project]
name = "singularity-agent"
version = "0.1.0"
description = "A production-oriented local coding agent runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
eval = [
    "PyYAML>=6",
]
sandbox = []
devtools = [
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "pytest>=8.0",
    "ruff>=0.6",
]
test = [
    "pytest-cov>=5.0",
    "pytest>=8.0",
]
build = [
    "hatchling",
]
release = [
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
singularity-agent = "singularity.cli:main"
sg = "singularity.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_provider: opt-in tests that call a real configured model provider",
]
norecursedirs = [
    ".git",
    ".singularity",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".test-tmp",
    ".venv",
    "__pycache__",
    "outputs",
    "work",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "outputs",
    "work",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
follow_imports = "skip"
files = [
    "src/singularity/cli_paths.py",
    "src/singularity/code_index/runtime.py",
    "src/singularity/git_runtime",
    "src/singularity/model/providers.py",
    "src/singularity/tool_protocol/parallel.py",
]

[tool.coverage.run]
branch = true
source = ["singularity"]
omit = [
    "*/tests/*",
    "*/work/*",
    "*/outputs/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["src/singularity"]

[build-system]
requires = ["hatchling", "editables>=0.5"]
build-backend = "hatchling.build"
