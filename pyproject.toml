[project]
name = "singularity-agent"
version = "0.1.0"
description = "A production-oriented local coding agent harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
eval = [
    "PyYAML>=6",
]
sandbox = []
devtools = [
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "pytest>=8.0",
    "ruff>=0.6",
]
test = [
    "pytest-cov>=5.0",
    "pytest>=8.0",
]
build = [
    "hatchling",
]
release = [
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
singularity-agent = "singularity.cli:main"
sg = "singularity.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not evaluation and not provider_eval and not slow'"
markers = [
    "unit: pure function/class tests with minimal or no cross-component wiring",
    "integration: multi-component tests that wire real subsystems together",
    "regression: production baseline, docs consistency, and schema stability guards",
    "security: trust boundary, redaction, injection, and secret safety tests",
    "evaluation: evaluation harness, scoring, replay, and benchmark infrastructure tests",
    "provider_eval: opt-in tests that call a real configured model provider",
    "slow: tests that take >5s or require external resources (docker, git, network)",
]
norecursedirs = [
    ".git",
    ".singularity",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".test-tmp",
    ".venv",
    "__pycache__",
    "outputs",
    "work",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "outputs",
    "work",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
follow_imports = "skip"
# Focused type gate over stable utilities plus the core agent harness path.
# `python -m mypy src/singularity` is tracked as a separate full-source backlog
# check until the package is type-clean.
files = [
    "src/singularity/agent_loop.py",
    "src/singularity/cli_paths.py",
    "src/singularity/code_index/index.py",
    "src/singularity/context/manager.py",
    "src/singularity/failure_analysis",
    "src/singularity/repair",
    "src/singularity/verification/contract.py",
    "src/singularity/verification/satisfaction.py",
    "src/singularity/git_client",
    "src/singularity/instructions/prompt_assembly.py",
    "src/singularity/kernel/agent_kernel.py",
    "src/singularity/kernel/graph.py",
    "src/singularity/kernel/lifecycle.py",
    "src/singularity/kernel/models.py",
    "src/singularity/model/providers.py",
    "src/singularity/model/request_builder.py",
    "src/singularity/model/runner.py",
    "src/singularity/observability/models.py",
    "src/singularity/observability/recorder.py",
    "src/singularity/policy/approval.py",
    "src/singularity/policy/audit.py",
    "src/singularity/policy/engine.py",
    "src/singularity/policy/models.py",
    "src/singularity/policy/risk.py",
    "src/singularity/planner/engine.py",
    "src/singularity/run_controller.py",
    "src/singularity/tool_protocol/engine.py",
    "src/singularity/tool_protocol/parallel.py",
    "src/singularity/tools/executor.py",
]

[tool.coverage.run]
branch = true
source = ["singularity"]
omit = [
    "*/tests/*",
    "*/work/*",
    "*/outputs/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["src/singularity"]

[build-system]
requires = ["hatchling", "editables>=0.5"]
build-backend = "hatchling.build"
