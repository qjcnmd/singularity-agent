[project]
name = "miniharness"
version = "0.0.1"
description = "A minimal read-only local coding agent harness for learning agent loops."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
miniharness = "miniharness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
