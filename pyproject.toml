[project]
name = "miniharness"
version = "0.0.11"
description = "A minimal local coding agent harness with production-grade planner, policy, tool, context, workspace state, mutation, command, and verification runtime slices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
    "tiktoken>=0.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
miniharness = "miniharness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
