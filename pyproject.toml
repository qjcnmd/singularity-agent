[project]
name = "miniharness"
version = "0.1.0"
description = "A production-grade local CLI coding agent harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
eval = [
    "PyYAML>=6",
]
sandbox = []
devtools = [
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
test = [
    "pytest>=8.0",
]
build = [
    "hatchling",
]
release = [
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
miniharness = "miniharness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".miniharness",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".test-tmp",
    ".venv",
    "__pycache__",
    "outputs",
    "work",
]

[build-system]
requires = ["hatchling", "editables>=0.5"]
build-backend = "hatchling.build"
