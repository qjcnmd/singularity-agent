# Supply-chain policy for the locked workspace graph.

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = ["RUSTSEC-2017-0008"]
unused-ignored-advisory = "deny"

[bans]
# The current lockfile has target/transitive duplicates and the workspace uses
# versionless path dependencies; keep both visible in CI.
multiple-versions = "warn"
wildcards = "warn"

[licenses]
# Licenses not listed here, including unknown and unlicensed crates, fail closed.
confidence-threshold = 0.93
unused-allowed-license = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
unused-allowed-source = "deny"
