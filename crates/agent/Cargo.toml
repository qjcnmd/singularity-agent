[package]
name = "singularity_agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# 仅供下游 crate 的测试构建启用：暴露隔离会话/workspace 夹具与自带临时
# 协调器的会话便利构造器。
test-support = ["dep:tempfile"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
singularity_core = { path = "../core" }
tempfile = { workspace = true, optional = true }
time.workspace = true
uuid = { workspace = true, features = ["v7"] }
singularity_model = { path = "../model" }
singularity_protocol = { path = "../protocol" }
regex.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
singularity_model = { path = "../model", features = ["test-support"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
