[package]
name = "singularity_agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tokio-util.workspace = true
tokio = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
singularity_core = { path = "../core" }
uuid = { workspace = true, features = ["v7"] }
singularity_model = { path = "../model" }
singularity_mcp = { path = "../mcp" }
singularity_protocol = { path = "../protocol" }
regex.workspace = true
thiserror.workspace = true
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10.0", features = ["tokio1", "job-object", "creation-flags"] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }
