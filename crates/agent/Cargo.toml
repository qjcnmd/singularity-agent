[package]
name = "singularity_agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# 仅供下游 crate 的测试构建启用：暴露自带协调器的会话构造与账本读取辅助。
test-support = []

[dependencies]
tokio-util.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
singularity_core = { path = "../core" }
uuid = { workspace = true, features = ["v7"] }
singularity_model = { path = "../model" }
singularity_mcp = { path = "../mcp" }
singularity_protocol = { path = "../protocol" }
regex.workspace = true
thiserror.workspace = true
similar = "3.2.0"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
]
