[package]
name = "singularity_runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# 仅供下游 crate 的测试构建启用：暴露 provider 注入接缝与共享测试
# 夹具（隔离 sessions 目录、确定性 provider 快照、进程停止钩子）。
test-support = [
    "dep:tempfile",
    "singularity_agent/test-support",
    "singularity_model/test-support",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
singularity_agent = { path = "../agent" }
singularity_core = { path = "../core" }
singularity_model = { path = "../model" }
singularity_protocol = { path = "../protocol" }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
# 执行器持有 provider 的执行环境句柄，因此运行期依赖是生产依赖。
tokio.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
singularity_agent = { path = "../agent", features = ["test-support"] }
singularity_model = { path = "../model", features = ["test-support"] }
tempfile.workspace = true
