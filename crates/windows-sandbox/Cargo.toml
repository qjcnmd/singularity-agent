[package]
name = "singularity_windows_sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
build = "build.rs"
include = [
    "src/**",
    "Cargo.toml",
    "build.rs",
    "singularity-windows-sandbox-setup.manifest",
    "LICENSE",
    "NOTICE",
    "UPSTREAM.md",
]

[lib]
name = "singularity_windows_sandbox"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "singularity-windows-sandbox-setup"
path = "src/bin/setup_main/main.rs"

[[bin]]
name = "singularity-command-runner"
path = "src/bin/command_runner/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
dirs-next = "2.0"
dunce = "1.0"
glob = "0.3"
globset = "0.4"
rand = { version = "0.8", default-features = false, features = ["std", "small_rng"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile.workspace = true
tracing-appender = "0.2.3"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Variant",
] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Rpc",
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
]

[dev-dependencies]
pretty_assertions = "1.4.1"
