const nav=document.querySelector('nav'),stage=document.querySelector('#stage'),world=document.querySelector('#world');
const NS='http://www.w3.org/2000/svg';
let scale=1,x=0,y=0,pointer=null;
function element(tag,attrs={},text){const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;return el}
function paint(){world.style.transform=`translate(${x}px,${y}px) scale(${scale})`}
function reset(){scale=Math.min(1,(stage.clientWidth-32)/1510);x=(stage.clientWidth-1510*scale)/2;y=8;paint()}
function draw(view){
 const height=Math.max(...view.nodes.map(n=>n.y))+170;
 const svg=element('svg',{width:1510,height,viewBox:`0 0 1510 ${height}`,role:'img','aria-label':view.title});
 const defs=element('defs'),marker=element('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});marker.append(element('path',{d:'M0 0 L10 5 L0 10 z',fill:'#947787'}));defs.append(marker);svg.append(defs);
 const nodes=new Map(view.nodes.map(n=>[n.id,n]));
 for(const [from,to,label] of view.edges){const a=nodes.get(from),b=nodes.get(to);let ax=a.x+200,ay=a.y+112,bx=b.x+200,by=b.y,d;
  if(a.y===b.y){ax=a.x+(b.x>a.x?400:0);ay=a.y+56;bx=b.x+(b.x>a.x?0:400);by=b.y+56;d=`M${ax} ${ay}H${bx}`}else if(b.y-a.y===175){const mid=(ay+by)/2;d=`M${ax} ${ay}V${mid}H${bx}V${by}`}else{ax=a.x+400;ay=a.y+56;const lane=a.x+440;d=`M${ax} ${ay}H${lane}V${by-30}H${bx}V${by}`}
  svg.append(element('path',{class:'edge',d}));if(label)svg.append(element('text',{class:'label',x:b.y-a.y===175||a.y===b.y?(ax+bx)/2:a.x+440,y:b.y-a.y===175||a.y===b.y?(ay+by)/2-8:Math.max(24,b.y-38)},label));
 }
 for(const n of view.nodes){const g=element('g',{class:'node','data-node':n.id}),a=element('a',{href:n.src,target:'_blank'});a.append(element('title',{},n.src));a.append(element('rect',{x:n.x,y:n.y,width:400,height:112,rx:13}));a.append(element('text',{class:'title',x:n.x+200,y:n.y+29},n.title));n.body.forEach((line,i)=>a.append(element('text',{class:'body',x:n.x+200,y:n.y+57+i*23},line)));g.append(a);svg.append(g)}
 world.replaceChildren(svg);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view.id)));reset();
}
for(const view of views){const button=document.createElement('button');button.textContent=view.title;button.dataset.view=view.id;button.onclick=()=>draw(view);nav.append(button)}
function zoom(f,px,py){const next=Math.max(.2,Math.min(2.5,scale*f));x=px-(px-x)*next/scale;y=py-(py-y)*next/scale;scale=next;paint()}
stage.addEventListener('wheel',event=>{event.preventDefault();const box=stage.getBoundingClientRect();zoom(Math.exp(-event.deltaY*.0015),event.clientX-box.left,event.clientY-box.top)},{passive:false});
stage.addEventListener('pointerdown',event=>{if(event.button!==0||event.target.closest('a'))return;pointer={id:event.pointerId,x:event.clientX,y:event.clientY};stage.setPointerCapture(event.pointerId)});
stage.addEventListener('pointermove',event=>{if(pointer?.id!==event.pointerId)return;x+=event.clientX-pointer.x;y+=event.clientY-pointer.y;pointer={id:event.pointerId,x:event.clientX,y:event.clientY};paint()});
for(const name of ['pointerup','pointercancel'])stage.addEventListener(name,()=>pointer=null);
stage.addEventListener('keydown',event=>{const step={ArrowLeft:[100,0],ArrowRight:[-100,0],ArrowUp:[0,100],ArrowDown:[0,-100],PageUp:[0,500],PageDown:[0,-500]};if(step[event.key]){event.preventDefault();x+=step[event.key][0];y+=step[event.key][1];paint()}else if(event.key==='Home')reset();else if(event.key==='+')zoom(1.2,stage.clientWidth/2,stage.clientHeight/2);else if(event.key==='-')zoom(1/1.2,stage.clientWidth/2,stage.clientHeight/2)});
