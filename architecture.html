<script>
const stage=document.querySelector('#stage'),world=document.querySelector('#world');
let scale=.85,offsetX=0,offsetY=0,pointer=null;
function paint(){world.style.transform=`translate(${offsetX}px,${offsetY}px) scale(${scale})`}
function start(){scale=.85;offsetX=stage.clientWidth/2-3716.0*scale;offsetY=24-237.4992*scale;paint()}
function zoomAt(factor,px=stage.clientWidth/2,py=stage.clientHeight/2){const next=Math.max(.025,Math.min(3,scale*factor));offsetX=px-(px-offsetX)*next/scale;offsetY=py-(py-offsetY)*next/scale;scale=next;paint()}
stage.addEventListener('wheel',event=>{event.preventDefault();const box=stage.getBoundingClientRect();zoomAt(Math.exp(-event.deltaY*.0015),event.clientX-box.left,event.clientY-box.top)},{passive:false});
stage.addEventListener('pointerdown',event=>{if(event.button!==0)return;pointer={id:event.pointerId,x:event.clientX,y:event.clientY};stage.setPointerCapture(event.pointerId);stage.classList.add('dragging')});
stage.addEventListener('pointermove',event=>{if(pointer?.id!==event.pointerId)return;offsetX+=event.clientX-pointer.x;offsetY+=event.clientY-pointer.y;pointer={id:event.pointerId,x:event.clientX,y:event.clientY};paint()});
function release(){pointer=null;stage.classList.remove('dragging')}stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);
stage.addEventListener('keydown',event=>{const steps={ArrowLeft:[120,0],ArrowRight:[-120,0],ArrowUp:[0,120],ArrowDown:[0,-120],PageUp:[0,stage.clientHeight*.8],PageDown:[0,-stage.clientHeight*.8]};if(steps[event.key]){event.preventDefault();offsetX+=steps[event.key][0];offsetY+=steps[event.key][1];paint()}else if(event.key==='+'||event.key==='=')zoomAt(1.25);else if(event.key==='-')zoomAt(.8);else if(event.key==='Home')start()});
start();
</script>
