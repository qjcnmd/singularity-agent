name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  checks:
    uses: ./.github/workflows/rust-gates.yml

  windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/cli/web/package-lock.json

      - name: Build embedded WebUI
        run: |
          npm --prefix crates/cli/web ci
          npm --prefix crates/cli/web run build

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Build release binary
        run: cargo build --release --locked --package singularity_cli --bins

      - name: Package Windows download
        id: package
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('dev-{0}', github.run_number) }}
        run: ./.github/scripts/package-release.ps1 -Version $env:RELEASE_VERSION

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

      - name: Publish tagged release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          $assets = @($env:RELEASE_ARCHIVE, $env:RELEASE_CHECKSUM)
          if (gh release view $env:GITHUB_REF_NAME *> $null) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes
          }
