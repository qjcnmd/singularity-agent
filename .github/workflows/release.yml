name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked --no-deps -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked --no-fail-fast

  windows-x86_64:
    needs: verify
    runs-on: windows-latest
    outputs:
      package-name: ${{ steps.package.outputs.name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Build release binaries
        run: cargo build --workspace --bins --release --locked

      - name: Assemble archive
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "dev-${{ github.run_number }}"
          }
          $name = "singularity-$version-windows-x86_64"
          $directory = Join-Path $PWD "dist/$name"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null

          @(
            "sg.exe",
            "singularity_app_server.exe",
            "singularity-command-runner.exe",
            "singularity-windows-sandbox-setup.exe"
          ) | ForEach-Object {
            $source = Join-Path $PWD "target/release/$_"
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "missing release binary: $source"
            }
            Copy-Item -LiteralPath $source -Destination $directory
          }

          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md -Destination $directory
          Copy-Item docs/INSTALL.md -Destination (Join-Path $directory "INSTALL.md")

          $archive = Join-Path $PWD "dist/$name.zip"
          Compress-Archive -LiteralPath $directory -DestinationPath $archive
          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $name.zip" | Set-Content -Encoding ascii (Join-Path $PWD "dist/SHA256SUMS.txt")

          "name=$name" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.archive }}
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [verify, windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ needs.windows-x86_64.outputs.package-name }}
          path: dist

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem -LiteralPath dist -Filter "*.zip" -File
          if ($archive.Count -ne 1) {
            throw "expected one release archive, found $($archive.Count)"
          }
          $archive = $archive.FullName
          if (gh release view $env:GITHUB_REF_NAME *> $null) {
            gh release upload $env:GITHUB_REF_NAME $archive dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $archive dist/SHA256SUMS.txt --verify-tag --generate-notes
          }
