name: Rust gates

on:
  workflow_call:
    inputs:
      rust_runner_matrix:
        description: JSON matrix whose runs_on values are JSON-encoded runner selectors
        required: false
        type: string
        default: '{"include":[{"name":"Linux","runs_on":"\"ubuntu-latest\""},{"name":"Windows","runs_on":"\"windows-latest\""}]}'
      supply_chain_runner:
        description: JSON-encoded runner selector for the supply-chain job
        required: false
        type: string
        default: '"ubuntu-latest"'
      run_supply_chain:
        description: Whether to run the supply-chain policy job
        required: false
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  supply-chain:
    if: ${{ inputs.run_supply_chain }}
    name: Supply-chain policy
    runs-on: ${{ fromJSON(inputs.supply_chain_runner) }}
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Install pinned supply-chain tools
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "cargo-tools"
          $auditRoot = Join-Path $toolRoot "cargo-audit"
          $denyRoot = Join-Path $toolRoot "cargo-deny"
          cargo install cargo-audit --version 0.22.2 --locked --root $auditRoot
          cargo install cargo-deny --version 0.20.2 --locked --root $denyRoot
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $auditRoot "bin")
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $denyRoot "bin")

      - name: Audit locked dependencies
        run: |
          cargo metadata --all-features --locked --format-version 1 --no-deps | Out-Null
          cargo audit --file Cargo.lock --deny warnings

      - name: Check locked dependency policy
        run: cargo deny --workspace --all-features --locked check advisories bans licenses sources

      - name: Clean self-hosted workspace
        if: ${{ always() && runner.environment == 'self-hosted' }}
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/')
          $repository = [IO.Path]::GetFullPath((git rev-parse --show-toplevel)).TrimEnd('\', '/')
          if (-not $repository.Equals($workspace, [StringComparison]::OrdinalIgnoreCase)) {
            throw "refusing to clean outside the runner workspace"
          }
          git reset --hard HEAD
          git clean -ffdx

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.rust_runner_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked --no-deps -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked --no-fail-fast

      - name: Build workspace binaries
        run: cargo build --workspace --bins --locked

      - name: Check repository diff
        run: git diff --check

      - name: Clean self-hosted workspace
        if: ${{ always() && runner.environment == 'self-hosted' }}
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/')
          $repository = [IO.Path]::GetFullPath((git rev-parse --show-toplevel)).TrimEnd('\', '/')
          if (-not $repository.Equals($workspace, [StringComparison]::OrdinalIgnoreCase)) {
            throw "refusing to clean outside the runner workspace"
          }
          git reset --hard HEAD
          git clean -ffdx
