name: Rust gates

on:
  workflow_call:
    inputs:
      rust_runner_matrix:
        description: JSON matrix whose runs_on values are JSON-encoded runner selectors and whose test_scope values select full or hosted_linux tests
        required: false
        type: string
        default: '{"include":[{"name":"Linux hosted contracts","runs_on":"\"ubuntu-latest\"","test_scope":"hosted_linux"},{"name":"Windows","runs_on":"\"windows-latest\"","test_scope":"full"}]}'
      supply_chain_runner:
        description: JSON-encoded runner selector for the supply-chain job
        required: false
        type: string
        default: '"ubuntu-latest"'
      run_supply_chain:
        description: Whether to run the supply-chain policy job
        required: false
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  supply-chain:
    if: ${{ inputs.run_supply_chain }}
    name: Supply-chain policy
    runs-on: ${{ fromJSON(inputs.supply_chain_runner) }}

    steps:
      - name: Configure isolated job environment
        run: |
          $jobHome = Join-Path $env:RUNNER_TEMP "home"
          $cargoHome = Join-Path $env:RUNNER_TEMP "cargo-home"
          $rustupHome = Join-Path $env:RUNNER_TEMP "rustup-home"
          New-Item -ItemType Directory -Path $jobHome, $cargoHome, $rustupHome -Force | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "HOME=$jobHome"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_HOME=$cargoHome"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RUSTUP_HOME=$rustupHome"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'cargo-target')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_INCREMENTAL=0"

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Restore Cargo registry and git cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry
            ${{ runner.temp }}/cargo-home/git
          key: rust-gates-supply-cargo-v1-${{ runner.os }}-rust-1.96.0-audit-0.22.2-deny-0.20.2

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Restore supply-chain tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-tools
          key: rust-gates-tools-v1-${{ runner.os }}-rust-1.96.0-audit-0.22.2-deny-0.20.2

      - name: Install pinned supply-chain tools
        run: |
          $ErrorActionPreference = "Stop"
          $toolRoot = Join-Path $env:RUNNER_TEMP "cargo-tools"
          $toolSpecs = @(
            @{ Name = "cargo-audit"; Version = "0.22.2"; Root = (Join-Path $toolRoot "cargo-audit") }
            @{ Name = "cargo-deny"; Version = "0.20.2"; Root = (Join-Path $toolRoot "cargo-deny") }
          )
          foreach ($tool in $toolSpecs) {
            $binaryName = $tool.Name
            if ($IsWindows) {
              $binaryName += ".exe"
            }
            $binary = Join-Path $tool.Root (Join-Path "bin" $binaryName)
            $needsInstall = -not (Test-Path -LiteralPath $binary -PathType Leaf)
            if (-not $needsInstall) {
              $versionOutput = (& $binary --version 2>&1 | Out-String).Trim()
              $versionPattern = "(?m)\b$([regex]::Escape($tool.Name))\s+$([regex]::Escape($tool.Version))\b"
              $needsInstall = ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch $versionPattern)
            }
            if ($needsInstall) {
              cargo install $tool.Name --version $tool.Version --locked --force --root $tool.Root
              if ($LASTEXITCODE -ne 0) {
                throw "failed to install $($tool.Name) $($tool.Version)"
              }
            }
          }
          $auditRoot = Join-Path $toolRoot "cargo-audit"
          $denyRoot = Join-Path $toolRoot "cargo-deny"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $auditRoot "bin")
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $denyRoot "bin")

      - name: Audit locked dependencies
        run: |
          cargo metadata --all-features --locked --format-version 1 --no-deps | Out-Null
          cargo audit --file Cargo.lock --deny warnings

      - name: Check locked dependency policy
        run: cargo deny --workspace --all-features --locked check advisories bans licenses sources

      - name: Clean self-hosted workspace
        if: ${{ always() && runner.environment == 'self-hosted' }}
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/')
          $repository = [IO.Path]::GetFullPath((git rev-parse --show-toplevel)).TrimEnd('\', '/')
          if (-not $repository.Equals($workspace, [StringComparison]::OrdinalIgnoreCase)) {
            throw "refusing to clean outside the runner workspace"
          }
          git reset --hard HEAD
          git clean -ffdx

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.rust_runner_matrix) }}

    steps:
      - name: Configure isolated job environment
        run: |
          $jobHome = Join-Path $env:RUNNER_TEMP "home"
          $cargoHome = Join-Path $env:RUNNER_TEMP "cargo-home"
          $rustupHome = Join-Path $env:RUNNER_TEMP "rustup-home"
          New-Item -ItemType Directory -Path $jobHome, $cargoHome, $rustupHome -Force | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "HOME=$jobHome"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_HOME=$cargoHome"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RUSTUP_HOME=$rustupHome"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'cargo-target')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_INCREMENTAL=0"

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Restore Cargo registry and git cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry
            ${{ runner.temp }}/cargo-home/git
          key: rust-gates-cargo-v1-${{ runner.os }}-rust-1.96.0-lock-${{ hashFiles('Cargo.lock') }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked --no-deps -- -D warnings

      - name: Test workspace (full)
        if: ${{ matrix.test_scope != 'hosted_linux' }}
        run: cargo test --workspace --all-targets --locked --no-fail-fast

      - name: Test workspace (hosted Linux contracts)
        if: ${{ matrix.test_scope == 'hosted_linux' }}
        run: |
          cargo test --workspace --all-targets --locked --no-fail-fast --exclude singularity_app_server --exclude singularity_sandbox

      - name: Test app-server (hosted Linux contracts)
        if: ${{ matrix.test_scope == 'hosted_linux' }}
        run: |
          cargo test -p singularity_app_server --all-targets --locked --no-fail-fast -- --skip native_linux_preflight_verifies_trusted_workspace_preparation

      - name: Test sandbox (hosted Linux contracts)
        if: ${{ matrix.test_scope == 'hosted_linux' }}
        run: |
          cargo test -p singularity_sandbox --all-targets --locked --no-fail-fast -- --skip linux_tests::

      - name: Build workspace binaries
        run: cargo build --workspace --bins --locked

      - name: Check repository diff
        run: git diff --check

      - name: Clean self-hosted workspace
        if: ${{ always() && runner.environment == 'self-hosted' }}
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/')
          $repository = [IO.Path]::GetFullPath((git rev-parse --show-toplevel)).TrimEnd('\', '/')
          if (-not $repository.Equals($workspace, [StringComparison]::OrdinalIgnoreCase)) {
            throw "refusing to clean outside the runner workspace"
          }
          git reset --hard HEAD
          git clean -ffdx
