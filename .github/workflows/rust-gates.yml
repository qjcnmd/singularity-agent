name: Rust gates

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    # 正常 <1 分钟；冷装 deny 需编译，20 分钟封顶防挂起烧满默认 360 分钟。
    timeout-minutes: 20

    steps:
      - name: Configure isolated job environment
        run: |
          $jobHome = Join-Path $env:RUNNER_TEMP "home"
          $cargoHome = Join-Path $env:RUNNER_TEMP "cargo-home"
          $rustupHome = Join-Path $env:RUNNER_TEMP "rustup-home"
          New-Item -ItemType Directory -Path $jobHome, $cargoHome, $rustupHome -Force | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "HOME=$jobHome"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_HOME=$cargoHome"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RUSTUP_HOME=$rustupHome"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'cargo-target')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_INCREMENTAL=0"

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Restore Cargo registry and git cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry
            ${{ runner.temp }}/cargo-home/git
          key: rust-gates-supply-cargo-v1-${{ runner.os }}-rust-1.96.0-deny-0.20.2

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Restore supply-chain tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-tools
          key: rust-gates-tools-v2-${{ runner.os }}-rust-1.96.0-deny-0.20.2

      - name: Install pinned dependency checker
        run: |
          $ErrorActionPreference = "Stop"
          $toolRoot = Join-Path $env:RUNNER_TEMP "cargo-tools"
          $binary = Join-Path $toolRoot "bin/cargo-deny"
          if (-not (Test-Path -LiteralPath $binary)) {
            cargo install cargo-deny --version 0.20.2 --locked --root $toolRoot
            if ($LASTEXITCODE -ne 0) { throw "cargo-deny installation failed" }
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $toolRoot "bin")

      - name: Check locked dependency policy
        run: cargo deny --workspace --all-features --locked check advisories bans licenses sources -D unmaintained -D unsound -D notice

      - name: Install pinned Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Audit WebUI production dependencies
        run: npm --prefix crates/cli/web audit --omit=dev --audit-level=high

  rust:
    name: Windows
    runs-on: windows-latest
    # 正常 3-5 分钟（冷缓存约 10 分钟级）；30 分钟封顶防挂起。
    timeout-minutes: 30

    steps:
      - name: Configure isolated job environment
        run: |
          $jobHome = Join-Path $env:RUNNER_TEMP "home"
          $cargoHome = Join-Path $env:RUNNER_TEMP "cargo-home"
          $rustupHome = Join-Path $env:RUNNER_TEMP "rustup-home"
          New-Item -ItemType Directory -Path $jobHome, $cargoHome, $rustupHome -Force | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "HOME=$jobHome"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_HOME=$cargoHome"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RUSTUP_HOME=$rustupHome"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'cargo-target')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_INCREMENTAL=0"

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Restore Cargo registry and git cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry
            ${{ runner.temp }}/cargo-home/git
          key: rust-gates-cargo-v1-${{ runner.os }}-rust-1.96.0-lock-${{ hashFiles('Cargo.lock') }}

      - name: Install pinned Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/cli/web/package-lock.json

      - name: Build embedded WebUI
        run: |
          npm --prefix crates/cli/web ci
          npm --prefix crates/cli/web run build

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt

      - name: Test WebUI state and timeline
        run: npm --prefix crates/cli/web test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked --no-deps -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --features singularity_protocol/typescript --locked --no-fail-fast

      - name: Build workspace binaries
        run: cargo build --workspace --bins --locked

      - name: Check repository diff
        run: git diff --check
