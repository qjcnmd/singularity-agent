name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: pwsh

jobs:
  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Restore Cargo registry and git cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-gates-supply-cargo-v1-${{ runner.os }}-rust-1.96.0-deny-0.20.2

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Restore supply-chain tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-tools
          key: rust-gates-tools-v2-${{ runner.os }}-rust-1.96.0-deny-0.20.2

      - name: Install pinned dependency checker
        run: |
          $ErrorActionPreference = "Stop"
          $toolRoot = Join-Path $env:RUNNER_TEMP "cargo-tools"
          $binary = Join-Path $toolRoot "bin/cargo-deny"
          if (-not (Test-Path -LiteralPath $binary)) {
            cargo install cargo-deny --version 0.20.2 --locked --root $toolRoot
            if ($LASTEXITCODE -ne 0) { throw "cargo-deny installation failed" }
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $toolRoot "bin")

      - name: Check locked dependency policy
        run: cargo deny --workspace --all-features --locked check advisories bans licenses sources

      - name: Install pinned Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Audit desktop production dependencies
        run: npm --prefix apps/desktop audit --omit=dev --audit-level=high

  rust:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Check production source size
        run: pwsh -File scripts/check.ps1 -Scope size

      - name: Restore Cargo registry and git cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-gates-cargo-v1-${{ runner.os }}-rust-1.96.0-lock-${{ hashFiles('Cargo.lock') }}

      - name: Install pinned Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Lint desktop sources
        run: npm --prefix apps/desktop run lint

      - name: Build desktop assets
        run: npm --prefix apps/desktop run build

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt

      - name: Check workspace architecture and identity parity
        run: pwsh -File scripts/check.ps1 -Scope arch -Check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify TypeScript protocol bindings are up to date
        run: cargo run -p protocol --features typescript --example export_types --locked -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked --no-deps -- -D warnings

      - name: Build workspace binaries
        run: cargo build --workspace --bins --locked

      - name: Run Rust property and backend invariant tests
        run: cargo test --workspace --locked
