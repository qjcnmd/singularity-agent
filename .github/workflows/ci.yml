name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_hosted_linux:
        description: Also run the manually requested GitHub-hosted Linux gates
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows self-hosted gates
    uses: ./.github/workflows/rust-gates.yml
    permissions:
      contents: read
    with:
      rust_runner_matrix: >-
        {"include":[{"name":"Windows self-hosted","runs_on":"[\"self-hosted\",\"windows\",\"x64\",\"singularity\"]"}]}
      supply_chain_runner: '["self-hosted","windows","x64","singularity"]'

  hosted-linux:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hosted_linux }}
    name: Manual GitHub-hosted Linux gates
    uses: ./.github/workflows/rust-gates.yml
    permissions:
      contents: read
    with:
      rust_runner_matrix: >-
        {"include":[{"name":"Linux hosted","runs_on":"\"ubuntu-latest\""}]}
      run_supply_chain: false
