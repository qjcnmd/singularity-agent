name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted:
    name: GitHub-hosted Linux and Windows gates
    uses: ./.github/workflows/rust-gates.yml
    permissions:
      contents: read
