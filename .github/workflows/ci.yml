name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_self_hosted_windows:
        description: Also run the manually requested self-hosted Windows native gates
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted:
    name: GitHub-hosted Linux and Windows gates
    uses: ./.github/workflows/rust-gates.yml
    permissions:
      contents: read

  self-hosted-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_self_hosted_windows }}
    name: Manual Windows self-hosted native gates
    uses: ./.github/workflows/rust-gates.yml
    permissions:
      contents: read
    with:
      rust_runner_matrix: >-
        {"include":[{"name":"Windows self-hosted","runs_on":"[\"self-hosted\",\"windows\",\"x64\",\"singularity\"]"}]}
      run_supply_chain: false
