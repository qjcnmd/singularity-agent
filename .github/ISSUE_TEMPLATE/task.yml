name: 工程任务（Task）
description: 描述需要解决的维护、构建或文档问题。
labels:
  - task
  - needs-triage
body:
  - type: textarea
    id: goal
    attributes:
      label: 问题或目标
      description: 要解决什么问题，完成后应该有什么结果？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）
      description: 已知范围、相关代码或检查方法。
