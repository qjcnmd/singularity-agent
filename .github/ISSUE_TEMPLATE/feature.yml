name: 功能需求（Feature）
description: 描述使用场景和希望改善的体验。
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: goal
    attributes:
      label: 使用场景与期望
      description: 你在什么场景遇到问题，希望能够怎样使用？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）
      description: 相关例子、限制或已有想法。
