name: 缺陷报告（Bug）
description: 描述实际问题和期望行为。
labels:
  - bug
  - needs-triage
body:
  - type: textarea
    id: symptom
    attributes:
      label: 问题与期望
      description: 实际发生了什么，你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现信息（可选）
      description: 已知的操作步骤、环境、错误信息或截图；无法稳定复现时说明观察到的条件。
