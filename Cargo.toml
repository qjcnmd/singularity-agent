[workspace]
members = [
    "crates/core",
    "crates/protocol",
    "crates/model",
    "crates/mcp",
    "crates/agent",
    "crates/app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
repository = "https://github.com/qjcnmd/singularity-agent"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = "deny"
needless_collect = "deny"
redundant_clone = "deny"
redundant_closure_for_method_calls = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unwrap_used = "deny"

[workspace.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.48", features = [
    "macros",
    "io-std",
    "io-util",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = "0.7"
uuid = { version = "1.11", features = ["v4"] }

# 内部程序异常直接终止；普通操作失败仍通过 Result 返回。
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
