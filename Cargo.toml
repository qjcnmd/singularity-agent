[workspace]
members = [
    "crates/core",
    "crates/protocol",
    "crates/store",
    "crates/policy",
    "crates/sandbox",
    "crates/tools",
    "crates/model",
    "crates/agent",
    "crates/app-server",
    "crates/cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/qjcnmd/singularity-agent"

[workspace.dependencies]
assert_cmd = "2.0"
clap = { version = "4.5", features = ["derive"] }
insta = { version = "1.41", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = { version = "0.8", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
uuid = { version = "1.11", features = ["serde", "v4"] }
