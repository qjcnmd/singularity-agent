[workspace]
members = [
    "crates/core",
    "crates/protocol",
    "crates/model",
    "crates/mcp",
    "crates/agent",
    "crates/app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
publish = false
repository = "https://github.com/qjcnmd/singularity-agent"

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
cast_possible_truncation = "warn"
correctness = { level = "deny", priority = -1 }
dbg_macro = "deny"
disallowed_methods = "deny"
format_collect = "deny"
format_push_string = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
large_futures = "deny"
manual_let_else = "deny"
match_wildcard_for_single_variants = "deny"
needless_collect = "deny"
needless_pass_by_value = "deny"
perf = { level = "deny", priority = -1 }
print_stdout = "deny"
redundant_clone = "deny"
redundant_closure_for_method_calls = "deny"
return_self_not_must_use = "warn"
semicolon_if_nothing_returned = "deny"
suspicious = { level = "deny", priority = -1 }
todo = "deny"
trivially_copy_pass_by_ref = "deny"
unimplemented = "deny"
uninlined_format_args = "deny"
unwrap_used = "deny"
use_self = "deny"
wildcard_imports = "deny"

[workspace.dependencies]
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
process-wrap = { version = "10.0", default-features = false, features = [
    "tokio1",
    "creation-flags",
    "job-object",
    "kill-on-drop",
    "tracing",
] }
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.48", features = [
    "macros",
    "io-std",
    "io-util",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
uuid = { version = "1.11", features = ["v4"] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }
proptest = { version = "1.6", default-features = false, features = ["std"] }

[profile.release]
panic = "abort"
